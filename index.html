<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Janti Wallpaper Maker — Hızlı Mod</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');
:root {
  --accent1:#00ffff;--accent2:#ff00ff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(180deg,#05060a,#0f1320);
  color:#fff;height:100vh;overflow:hidden;
}
#wallpaper{
  position:fixed;inset:0;
  background-size:cover;
  background-position:center;
  filter:brightness(0.6) hue-rotate(0deg);
  z-index:-2;
  transition:background-image 0.15s ease-in,filter 0.12s linear;
}
#overlay{
  position:fixed;inset:0;
  backdrop-filter:blur(4px);
  background:rgba(0,0,0,0.25);
  z-index:-1;
  transition:backdrop-filter 0.12s linear,background 0.12s linear;
}
h1{
  text-align:center;
  font-size:1.6rem;
  margin-top:22px;
  text-shadow:0 0 12px var(--accent1),0 0 24px var(--accent2);
  animation:glow 2s infinite alternate;
}
@keyframes glow{
  from{text-shadow:0 0 8px var(--accent2),0 0 18px var(--accent1);}
  to{text-shadow:0 0 18px var(--accent1),0 0 36px var(--accent2);}
}
#controls{
  position:absolute;
  bottom:80px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.55);
  padding:10px 14px;border-radius:12px;
  box-shadow:0 4px 16px rgba(0,255,255,0.08);
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
}
select,button{
  font-family:'Poppins';font-weight:700;
  border:none;border-radius:8px;
  padding:7px 10px;font-size:0.9rem;
  cursor:pointer;
}
select{background:rgba(0,0,0,0.7);color:#fff;border:1px solid var(--accent1);}
button.primary{
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  color:#000;
}
button.ghost{
  background:rgba(255,255,255,0.05);
  color:#fff;
}
.small-btn{
  background:rgba(255,255,255,0.03);
  color:#fff;border:1px solid rgba(255,255,255,0.05);
}
#settings-panel{
  position:absolute;top:70px;right:20px;
  width:240px;background:rgba(0,0,0,0.72);
  border:1px solid rgba(0,255,255,0.08);
  padding:12px;border-radius:10px;
  display:none;z-index:40;
}
#settings-panel h3{margin-bottom:6px;font-size:1rem;color:var(--accent1)}
label{font-size:0.82rem;margin:6px 0 4px;display:block}
input[type=range]{width:100%}
footer{
  position:absolute;bottom:8px;width:100%;
  text-align:center;font-size:0.8rem;
  color:rgba(255,255,255,0.55)
}
</style>
</head>
<body>
<div id="wallpaper"></div>
<div id="overlay"></div>
<h1>⚡ Janti Wallpaper Maker — Hızlı Mod</h1>

<div id="controls">
  <select id="category">
    <option value="araba">🚗 Araba</option>
    <option value="doğa">🌲 Doğa</option>
    <option value="uzay">🚀 Uzay</option>
    <option value="şehir">🏙️ Şehir</option>
  </select>
  <button id="prev" class="small-btn">◀</button>
  <button id="generate" class="primary">🖼️ Oluştur</button>
  <button id="next" class="small-btn">▶</button>
  <button id="slideshow" class="ghost">⏵︎ Slayt</button>
  <select id="speed">
    <option value="2000">2s</option>
    <option value="4000" selected>4s</option>
    <option value="6000">6s</option>
  </select>
  <button id="download" class="ghost">⬇️</button>
  <button id="settings" class="small-btn">⚙️</button>
</div>

<div id="settings-panel">
  <h3>Ayarlar</h3>
  <label>Parlaklık</label><input type="range" id="bright" min="0.3" max="1.2" step="0.05" value="0.6">
  <label>Bulanıklık</label><input type="range" id="blur" min="0" max="10" step="0.5" value="4">
  <label>Renk Tonu</label><input type="range" id="hue" min="0" max="360" step="5" value="0">
</div>

<footer>© 2025 Janti Originall</footer>

<script>
const wp=document.getElementById("wallpaper"),ov=document.getElementById("overlay");
const cat=document.getElementById("category"),gen=document.getElementById("generate");
const prev=document.getElementById("prev"),next=document.getElementById("next");
const slideBtn=document.getElementById("slideshow"),spd=document.getElementById("speed");
const stg=document.getElementById("settings"),panel=document.getElementById("settings-panel");
const b=document.getElementById("bright"),bl=document.getElementById("blur"),h=document.getElementById("hue");

const lists={
  araba:["https://images.unsplash.com/photo-1503736334956-4c8f8e92946d","https://images.unsplash.com/photo-1503376780353-7e6692767b70","https://images.unsplash.com/photo-1552519507-da3b142c6e3d","https://images.unsplash.com/photo-1525609004556-c46c7d6cf023"],
  doğa:["https://images.unsplash.com/photo-1501785888041-af3ef285b470","https://images.unsplash.com/photo-1506744038136-46273834b3fb","https://images.unsplash.com/photo-1500530855697-b586d89ba3ee","https://images.unsplash.com/photo-1441974231531-c6227db76b6e"],
  uzay:["https://images.unsplash.com/photo-1462331940025-496dfbfc7564","https://images.unsplash.com/photo-1446776811953-b23d57bd21aa","https://images.unsplash.com/photo-1470364693235-a4c2e9563b43","https://images.unsplash.com/photo-1504198453319-5ce911bafcde"],
  şehir:["https://images.unsplash.com/photo-1494526585095-c41746248156","https://images.unsplash.com/photo-1508057198894-247b23fe5ade","https://images.unsplash.com/photo-1473187983305-f615310e7daa","https://images.unsplash.com/photo-1501594907352-04cda38ebc29"]
};

let arr=[],i=0,timer=null;
function url(u){return u+"?auto=format&fit=crop&w=1920&q=80&sig="+Math.random()}
function preload(l){for(let j=0;j<Math.min(8,l.length);j++){let im=new Image();im.src=url(l[(i+j)%l.length]);}}
function show(n){if(!arr.length)return;i=(n+arr.length)%arr.length;wp.style.backgroundImage=`url('${url(arr[i])}')`;preload(arr);}
function pick(c){arr=lists[c];i=Math.floor(Math.random()*arr.length);show(i);}

gen.onclick=()=>pick(cat.value);
prev.onclick=()=>show(i-1);
next.onclick=()=>show(i+1);
cat.onchange=()=>pick(cat.value);

let play=false;
function start(){if(play)return;play=true;slideBtn.textContent="❚❚";timer=setInterval(()=>show(i+1),spd.value);}
function stop(){if(!play)return;play=false;slideBtn.textContent="⏵︎";clearInterval(timer);}
slideBtn.onclick=()=>play?stop():start();
spd.onchange=()=>{if(play){stop();start();}};

stg.onclick=()=>panel.style.display=panel.style.display==="block"?"none":"block";
[b,bl,h].forEach(x=>x.oninput=()=>{wp.style.filter=`brightness(${b.value}) hue-rotate(${h.value}deg)`;ov.style.backdropFilter=`blur(${bl.value}px)`;});

pick(cat.value);
</script>
</body>
</html>
